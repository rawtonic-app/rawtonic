# CRW
make = "Canon"
model = "Canon PowerShot Pro70"
clean_make = "Canon"
clean_model = "PowerShot Pro70"
blackpoint = 34
whitepoint = 990
# RAWTONIC: 8-row x 2-column CMYG mosaic, plane order, levels and default
# crop as Adobe DNG Converter 18.7 writes them for the raw.pixls.us sample
# (CFAPattern2 5 3 4 1 3 5 1 4 5 3 1 4 3 5 4 1, CFAPlaneColor Green,
# Magenta, Cyan, Yellow; BlackLevel 34, WhiteLevel 990; DefaultCrop 8 0
# 1536 x 1024 of 1552 x 1024).
color_pattern = "YCMGCYGMYCGMCYMG"
plane_color = "GMCY"
crop_area = [8, 0, 8, 0]

[cameras.color_matrix]
A = [-0.3134, 0.8164, 0.1796, 0.4059, -0.0318, 0.3818, -0.4285, 0.8509, 0.6816, -0.0731, 0.8024, 0.2184]
D65 = [-0.5106, 1.0695, 0.1576, 0.382, 0.0053, 0.4566, -0.6497, 1.0736, 0.6701, -0.3336, 1.1887, 0.1394]
