# Rawtonic patch: Ixpress CF132 3FR files carry only the shutter mode as Model
# (" Flash Sync"); Adobe DNG Converter names the sensor "22-Uncoated".
make = "Hasselblad"
model = " Flash Sync"
clean_make = "Hasselblad"
clean_model = "CF132"
whitepoint = 62914
color_pattern = "RGGB"
active_area = [0, 0, 0, 0]
crop_area = [4, 4, 4, 4]
model_aliases = [
  ["Flash Sync", "CF132"],
]

[cameras.color_matrix]
D65 = [0.8523, -0.3257, -0.028, -0.5078, 1.3458, 0.1743, -0.1449, 0.2961, 0.7809]
