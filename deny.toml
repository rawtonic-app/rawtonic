[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later", "LGPL-2.1", "LGPL-2.1-or-later", "LGPL-3.0-or-later", "BSL-1.0", "CDLA-Permissive-2.0", "NCSA"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/CyberTimon/RapidRAW-DngLab.git", "https://github.com/CyberTimon/libgphoto2-rs"]
