[package]
name = "rawtonic-denoise"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI denoising of Bayer mosaics (Nonlocal MatchFilter) for Rawtonic, independent of Tauri"

[dependencies]
anyhow.workspace = true
half = "2.7.1"
rayon = "1.12.0"
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0" }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
rawtonic-onnx = { path = "../onnx", version = "0.1.0" }
ndarray = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSString", "NSURL", "NSArray", "NSValue", "NSError", "NSDictionary"] }
objc2-core-ml = { version = "0.3.2", features = ["MLModel", "MLMultiArray", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLFeatureValue", "MLModelConfiguration", "MLModel_MLModelCompilation", "MLPredictionOptions", "block2"] }

[dev-dependencies]
tempfile.workspace = true
