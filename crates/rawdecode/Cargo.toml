[package]
name = "rawtonic-rawdecode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
description = "RAW decode for Rawtonic: rawler front end, demosaic, DNG opcodes, camera colour and capture metadata. No desktop dependencies."

[features]
default = []
performance-profiling = ["rawtonic-runtime/performance-profiling"]
test-support = []

[lints]
workspace = true

[dependencies]
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rawler = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
kamadak-exif = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
criterion = { workspace = true, features = ["cargo_bench_support"] }

# Hot-path benchmarks (docs/DEVELOPMENT.md "Benchmarks"); the synthetic
# fallback inputs need `test-support`.
[[bench]]
name = "decode"
harness = false
required-features = ["test-support"]
