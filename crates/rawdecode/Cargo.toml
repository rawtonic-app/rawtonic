[package]
name = "rawtonic-rawdecode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
description = "RAW decode for Rawtonic: rawler front end, demosaic, DNG opcodes, camera colour and capture metadata. No desktop dependencies."

[features]
default = []
performance-profiling = ["rawtonic-runtime/performance-profiling"]
test-support = []

[dependencies]
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git", version = "0.7.1" }
image = "0.25.10"
rayon = "1.12.0"
wgpu = "29.0"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0.104"
kamadak-exif = "0.6.1"
log = "0.4"
serde.workspace = true
sha2.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
pollster = "1.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Hot-path benchmarks (docs/DEVELOPMENT.md "Benchmarks"); the synthetic
# fallback inputs need `test-support`.
[[bench]]
name = "decode"
harness = false
required-features = ["test-support"]
