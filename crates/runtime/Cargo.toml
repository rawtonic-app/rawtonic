[package]
name = "rawtonic-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Process helpers shared by the Rawtonic engine crates: opt-in stage timing and allocator release."

[features]
default = []
# Stage timing written to the log (stderr without a logger); never in normal builds.
performance-profiling = ["dep:serde_json", "dep:log", "dep:libc"]

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true, optional = true }
log = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
