[package]
name = "rawtonic-fileops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Journaled, undoable file operations (rename, move, trash) for Rawtonic, independent of Tauri"

[lints]
workspace = true

[dependencies]
rawtonic-fs = { path = "../fs", version = "0.1.0" }
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rusqlite = { workspace = true, features = ["bundled"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
rawtonic-fs = { path = "../fs", version = "0.1.0", features = ["test-support"] }
tempfile = { workspace = true }
