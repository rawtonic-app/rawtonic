[package]
name = "rawtonic-interop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only readers for Lightroom Classic catalogs and Capture One sessions, independent of Tauri"

[lints]
workspace = true

[features]
# Builds masks from pixel values (`capture_one_masks::Raster::from_values`)
# for other crates' tests.
test-support = []

[dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
flate2 = { workspace = true }
rawtonic-metadata = { path = "../metadata", version = "0.1.0" }
rawtonic-fs = { path = "../fs", version = "0.1.0" }
anyhow = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
