[package]
name = "rawtonic-tether"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Camera tethering helper process (libgphoto2 isolated from the app) and its client"

[features]
default = []
# The real camera backend: links libgphoto2 (LGPL-2.1-or-later) dynamically,
# only into the helper binary. Needs libgphoto2 found by pkg-config.
gphoto2 = ["dep:gphoto2"]

[lints]
workspace = true

[dependencies]
log = { workspace = true }
rawtonic-fs = { path = "../fs", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gphoto2 = { git = "https://github.com/CyberTimon/libgphoto2-rs", optional = true, features = ["log"] }

[[bin]]
name = "rawtonic-tether"
path = "src/bin/rawtonic-tether.rs"
