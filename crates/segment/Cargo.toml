[package]
name = "rawtonic-segment"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rawtonic's automatic selections: the sky (UperNet) and the subject (BiRefNet) of a photo as masks, on ONNX Runtime or Core ML, independent of Tauri"

[dependencies]
anyhow.workspace = true
base64 = "0.23"
image = "0.25.10"
log = "0.4"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
rawtonic-onnx = { path = "../onnx", version = "0.1.0" }
rayon = "1.12.0"
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rawtonic-denoise = { path = "../denoise", version = "0.1.0" }
