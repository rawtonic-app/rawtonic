[package]
name = "rawtonic-segment"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rawtonic's automatic selections: the sky (UperNet) and the subject (BiRefNet) of a photo as masks, on ONNX Runtime or Core ML, independent of Tauri"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
image = { workspace = true }
log = { workspace = true }
ndarray = { workspace = true }
ort = { workspace = true, features = ["std", "ndarray", "load-dynamic", "api-22"] }
rawtonic-onnx = { path = "../onnx", version = "0.1.0" }
rayon = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rawtonic-denoise = { path = "../denoise", version = "0.1.0" }
