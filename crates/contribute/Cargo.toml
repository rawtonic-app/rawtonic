[package]
name = "rawtonic-contribute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contribution channels' shared core: scrubbing, the reviewed payload and the relay client (ADR 0017)"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
gethostname = "1.1"
log = { workspace = true }
rawtonic-metadata = { path = "../metadata", version = "0.1.0" }
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
tempfile = { workspace = true }
