[package]
name = "rawtonic-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
description = "Rawtonic's wgpu develop pipeline: GpuProcessor, shader variants, tiled readback and the native display presentation. No desktop dependencies."

[features]
default = []
performance-profiling = [
    "wgpu/counters",
    "rawtonic-engine/performance-profiling",
    "rawtonic-rawdecode/performance-profiling",
    "rawtonic-runtime/performance-profiling",
]

[lints]
workspace = true

[dependencies]
rawtonic-engine = { path = "../engine", version = "0.1.0" }
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0" }
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rawtonic-fs = { path = "../fs", version = "0.1.0" }
# Display variants compile from naga IR with decided branches removed
# (display_variant_ir.rs); wgpu's own naga version.
wgpu = { workspace = true, features = ["naga-ir"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
bytemuck = { workspace = true, features = ["derive"] }
half = { workspace = true, features = ["bytemuck"] }
image = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
# The idle compile helper's private folder (`idle_compile_child`).
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Loads the bundled DXC validator by full path (dx12_compiler.rs).
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
base64 = { workspace = true }
rawtonic-engine = { path = "../engine", version = "0.1.0", features = ["test-support"] }
# compile_probe writes SPIR-V itself (its `spirv` candidates).
# hlsl-out: the DX12 HLSL of display variants is checked off Windows
# (display_variant_ir tests; vendor/naga/RAWTONIC_PATCH.md).
naga = { version = "30.0.1", features = ["spv-out", "hlsl-out"] }
