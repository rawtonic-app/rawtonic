[package]
name = "rawtonic-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
description = "Rawtonic's wgpu develop pipeline: GpuProcessor, shader variants, tiled readback and the native display presentation. No desktop dependencies."

[features]
default = []
performance-profiling = [
    "wgpu/counters",
    "rawtonic-engine/performance-profiling",
    "rawtonic-runtime/performance-profiling",
]

[lints]
workspace = true

[dependencies]
rawtonic-engine = { path = "../engine", version = "0.1.0" }
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0" }
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rawtonic-fs = { path = "../fs", version = "0.1.0" }
# Display variants compile from naga IR with decided branches removed
# (display_variant_ir.rs); wgpu's own naga version.
wgpu = { workspace = true, features = ["naga-ir"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
bytemuck = { workspace = true, features = ["derive"] }
half = { workspace = true, features = ["bytemuck"] }
image = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rawtonic-engine = { path = "../engine", version = "0.1.0", features = ["test-support"] }
tempfile = { workspace = true }
