[package]
name = "rawtonic-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forced system-call answers for other crates' tests (`test_hooks`).
test-support = []

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
