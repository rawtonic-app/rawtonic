[package]
name = "rawtonic-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = { workspace = true }
rawtonic-catalog = { path = "../catalog", version = "0.1.0" }
rawtonic-ingest = { path = "../ingest", version = "0.1.0" }
rawtonic-engine = { path = "../engine", version = "0.1.0" }
rawtonic-export = { path = "../export", version = "0.1.0" }
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0" }
rawtonic-denoise = { path = "../denoise", version = "0.1.0" }
rawtonic-faces = { path = "../faces", version = "0.1.0" }
rawtonic-segment = { path = "../segment", version = "0.1.0" }
rawtonic-onnx = { path = "../onnx", version = "0.1.0" }
image = { workspace = true }
rawtonic-metadata = { path = "../metadata", version = "0.1.0" }
rawtonic-merge = { path = "../merge", version = "0.1.0" }
# search-bench: a library as an older Rawtonic left it.
rusqlite = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0", features = ["test-support"] }
tempfile = { workspace = true }

[[bin]]
name = "rawtonic"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
mimalloc = { workspace = true }
