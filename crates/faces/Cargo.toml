[package]
name = "rawtonic-faces"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Faces for Rawtonic: detection, landmarks and parsing into skin, hair, eyes and lips, and masks of those parts, independent of Tauri"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
image = { workspace = true }
ndarray = { workspace = true }
ort = { workspace = true, features = ["std", "ndarray", "load-dynamic", "api-22"] }
rawtonic-onnx = { path = "../onnx", version = "0.1.0" }
rayon = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rawtonic-fs = { path = "../fs", version = "0.1.0" }
tempfile = { workspace = true }
