[package]
name = "rawtonic-faces"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Faces for Rawtonic: detection, landmarks and parsing into skin, hair, eyes and lips, and masks of those parts, independent of Tauri"

[dependencies]
anyhow.workspace = true
base64 = "0.23"
serde_json.workspace = true
image = "0.25.10"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
rawtonic-onnx = { path = "../onnx", version = "0.1.0" }
rayon = "1.12.0"
