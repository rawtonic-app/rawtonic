[package]
name = "rawtonic-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Failure injection for other crates' tests of all-or-nothing writes.
test-support = []

[lints]
workspace = true

[dependencies]
rusqlite = { workspace = true, features = ["bundled", "serde_json", "functions"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rawtonic-fs = { path = "../fs", version = "0.1.0" }
rawtonic-metadata = { path = "../metadata", version = "0.1.0" }
log = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
# Whole-session moves run through the file operation journal (tests/session_move.rs).
rawtonic-fileops = { path = "../fileops", version = "0.1.0" }
# `Library::fail_when_marking`: a failing write inside mark_changed_elsewhere.
rawtonic-catalog = { path = ".", features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
