[package]
name = "rawtonic-export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
description = "Rawtonic export: full-resolution render, resize/border/watermark, encoders and no-clobber output. No desktop dependencies."

[features]
default = []
performance-profiling = [
    "rawtonic-gpu/performance-profiling",
    "rawtonic-engine/performance-profiling",
    "rawtonic-runtime/performance-profiling",
]

[lints]
workspace = true

[dependencies]
rawtonic-engine = { path = "../engine", version = "0.1.0" }
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0" }
rawtonic-gpu = { path = "../gpu", version = "0.1.0" }
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rawtonic-fs = { path = "../fs", version = "0.1.0" }
rawtonic-metadata = { path = "../metadata", version = "0.1.0" }
rawtonic-naming = { path = "../naming", version = "0.1.0" }
rawler = { workspace = true }
kamadak-exif = { workspace = true }
little_exif = { workspace = true }
chrono = { workspace = true }
crc32fast = "1.5"
blake3 = { workspace = true }
bytemuck = { workspace = true }
sha2 = { workspace = true }
filetime = "0.2"
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
turbojpeg = { workspace = true, features = ["cmake"] }
png = { workspace = true }
webp = "0.3"
jxl-encoder = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rusqlite = { workspace = true, features = ["bundled"] }
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap"] }
skrifa = "0.48.0"
ab_glyph_rasterizer = "0.1.10"
miniz_oxide = "0.8.9"
# 0.14 shares read-fonts 0.45 with skrifa 0.48 (0.15 would add a second copy).
harfrust = "=0.14.0"
unicode-bidi = "0.3.18"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
turbojpeg = { workspace = true, features = ["cmake", "require-simd"] }

[dev-dependencies]
rawtonic-segment = { path = "../segment", version = "0.1.0" }
rawtonic-engine = { path = "../engine", version = "0.1.0", features = ["test-support"] }
tempfile = { workspace = true }
jxl-oxide = { workspace = true, features = ["image"] }
half = { workspace = true }
lopdf = { version = "0.46", default-features = false }
flate2 = { workspace = true }
rawtonic-rawdecode = { path = "../rawdecode", version = "0.1.0", features = ["test-support"] }
criterion = { workspace = true, features = ["cargo_bench_support"] }

# Hot-path benchmarks (docs/DEVELOPMENT.md "Benchmarks").
[[bench]]
name = "encode"
harness = false
