[package]
name = "rawtonic-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rawtonic-fs = { path = "../fs", version = "0.1.0" }
rawtonic-runtime = { path = "../runtime", version = "0.1.0" }
rawtonic-metadata = { path = "../metadata", version = "0.1.0" }
kamadak-exif = { workspace = true }
memchr = "2.8.3"
roxmltree = { workspace = true }
rawler = { workspace = true }
log = { workspace = true }
rawtonic-naming = { path = "../naming", version = "0.1.0" }
rawtonic-catalog = { path = "../catalog", version = "0.1.0" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tempfile = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
image = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
rawtonic-merge = { path = "../merge", version = "0.1.0" }
rawtonic-catalog = { path = "../catalog", version = "0.1.0", features = ["test-support"] }
tempfile = { workspace = true }
