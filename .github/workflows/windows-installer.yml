# The experimental, unsigned Windows x64 downloads: the NSIS installer
# (per-user), the MSI (per-machine) and a portable zip, built as the private
# Windows build does it (`tauri build`, ONNX Runtime bundled, no DXC, static
# VC runtime with dynamic UCRT), scanned with Microsoft Defender, then each
# installed (or unpacked) on a fresh runner, tried in a headless export and
# uninstalled. Runs on demand and for version tags; the downloads and
# SHA256SUMS-windows.txt are kept as a workflow artifact and attached to a
# release by scripts/release.sh (packaging/README.md).
name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  # No release with an open advisory, unmaintained crates included (ADR 0005).
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
  build:
    needs: advisories
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CI: "true"
      # Pinned ONNX Runtime and its WebGPU plugin, SHA-256-checked by build.rs.
      RAWTONIC_BUNDLE_ONNX: "1"
      # A release build never carries the QA bridge's frontend.
      VITE_RAWTONIC_QA: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The workspace pins 1.98.1, src-tauri (where tauri runs cargo) 1.98.
      - name: Rust toolchains
        run: |
          rustup toolchain install 1.98.1 1.98 --profile minimal --no-self-update
          rustc --version
          Push-Location src-tauri; rustc --version; Pop-Location
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      - run: npm ci
      # MSI needs a numeric ProductVersion: 0.1.0-alpha.11.1 -> 0.1.0.1101
      # (alpha 0-19999, beta 20000+, rc 40000+, a final release 60000), so
      # it rises from release to release. Tauri's MSI allows downgrades, so
      # any other version replaces an installed one.
      - name: Build the NSIS installer and the MSI
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+)(?:\.(\d+))?)?$') { Write-Error "version $version has no MSI mapping"; exit 1 }
          $stage = @{ alpha = 0; beta = 20000; rc = 40000 }
          $build = if ($Matches[4]) { $stage[$Matches[4]] + 100 * [int]$Matches[5] + [int]$Matches[6] } else { 60000 }
          if ($Matches[5] -and ([int]$Matches[5] -ge 200 -or [int]$Matches[6] -ge 100)) { Write-Error "version $version overflows the MSI mapping"; exit 1 }
          $msiVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$build"
          "version $version, MSI version $msiVersion"
          $wix = Join-Path $env:RUNNER_TEMP 'wix-version.json'
          [IO.File]::WriteAllText($wix, (@{ bundle = @{ windows = @{ wix = @{ version = $msiVersion } } } } | ConvertTo-Json -Depth 5))
          npm run tauri -- build --bundles nsis,msi --ci --config $wix -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERSION=$version" >> $env:GITHUB_ENV
      # Static VC runtime: no VCRUNTIME/MSVCP imports, so no VC++
      # redistributable is needed; the UCRT is part of Windows 10/11.
      - name: Check the executable's imports and the bundled files
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $imports = & $dumpbin /nologo /dependents target\release\rawtonic-app.exe
          $imports
          if ($imports -match '(?i)vcruntime|msvcp') { Write-Error 'The app imports the VC runtime dynamically'; exit 1 }
          foreach ($dll in 'onnxruntime.dll', 'onnxruntime_providers_webgpu.dll') {
            if (-not (Test-Path "src-tauri\resources\$dll")) { Write-Error "$dll not bundled"; exit 1 }
          }
      # Three downloads: the NSIS installer (per-user), the MSI (per-machine,
      # administrator) and a portable zip. The zip holds exactly the files the
      # MSI installs (an administrative extraction, `msiexec /a`, installs
      # nothing): the app finds its resources beside its executable, so it
      # runs from any folder.
      - name: Collect the installers and the portable zip
        run: |
          New-Item -ItemType Directory installer-out | Out-Null
          $setup = @(Get-ChildItem target\release\bundle\nsis\*-setup.exe)
          $msi = @(Get-ChildItem target\release\bundle\msi\*.msi)
          if ($setup.Count -ne 1 -or $msi.Count -ne 1) { Write-Error "expected one installer of each kind, found $($setup.Count) NSIS, $($msi.Count) MSI"; exit 1 }
          Copy-Item $setup[0] "installer-out\Rawtonic_${env:VERSION}_x64-setup.exe"
          # Tauri names the MSI by its numeric MSI version; the release uses the app version.
          Copy-Item $msi[0] "installer-out\Rawtonic_${env:VERSION}_x64.msi"
          $admin = Join-Path $env:RUNNER_TEMP 'msi-admin'
          $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$admin`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "administrative extraction failed ($($p.ExitCode))"; exit 1 }
          $exe = @(Get-ChildItem $admin -Recurse -Filter rawtonic-app.exe)
          if ($exe.Count -ne 1) { Write-Error "expected one rawtonic-app.exe in the MSI, found $($exe.Count)"; exit 1 }
          $root = $exe[0].Directory.FullName
          Get-ChildItem $admin -Recurse -Filter *.msi | Remove-Item
          foreach ($need in 'resources\onnxruntime.dll', 'resources\onnxruntime_providers_webgpu.dll', 'lensfun_db') {
            if (-not (Test-Path (Join-Path $root $need))) { Write-Error "the portable folder lacks $need"; exit 1 }
          }
          $dxc = Get-ChildItem $root -Recurse -Include dxcompiler.dll, dxil.dll
          if ($dxc) { Write-Error "DXC must not be bundled: $dxc"; exit 1 }
          # The zip holds one folder, Rawtonic\, so unpacking it never scatters files.
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item $root (Join-Path $stage 'Rawtonic') -Recurse
          Compress-Archive -Path (Join-Path $stage 'Rawtonic') -DestinationPath "installer-out\Rawtonic_${env:VERSION}_x64-portable.zip" -CompressionLevel Optimal
          Set-Location installer-out
          # sha256sum format (lower-case hash, two spaces, name), LF endings.
          $text = ''
          foreach ($f in Get-ChildItem -File | Sort-Object Name) {
            $text += "{0}  {1}`n" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f.Name
            "{0}: {1} bytes" -f $f.Name, $f.Length
          }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS-windows.txt", $text)
          Get-Content SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-out/
          retention-days: 14
  # Microsoft Defender on a fresh runner, with signatures updated just before:
  # each download and the app executable inside them are scanned. Evidence,
  # not proof: users' PCs also use cloud protection, reputation (SmartScreen,
  # Smart App Control) and newer signatures. The verdicts go to the run
  # summary and the windows-defender artifact; scripts/release.sh reads them.
  defender:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer-out
      - name: Scan with Microsoft Defender
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $out = Join-Path $env:RUNNER_TEMP 'defender'
          New-Item -ItemType Directory $out | Out-Null
          $sum = [Collections.Generic.List[string]]::new()
          $sum.Add('## Microsoft Defender scan')
          $sum.Add('')
          $sum.Add('Evidence, not proof: a scan on one GitHub runner with freshly updated signatures. Users'' PCs also use cloud protection, reputation (SmartScreen, Smart App Control) and newer signatures, so a clean result here does not promise a clean download there.')
          $sum.Add('')
          # Ask for cloud protection; the runner may refuse (Tamper Protection, policy).
          try {
            Set-MpPreference -MAPSReporting Advanced -CloudBlockLevel High -CloudExtendedTimeout 50 -ErrorAction Stop
            $cloudPref = 'set (MAPS Advanced, cloud block level High)'
          } catch { $cloudPref = "refused: $($_.Exception.Message)" }
          & $mp -SignatureUpdate *> "$out\signature-update.txt"
          $sigExit = $LASTEXITCODE
          & $mp -ValidateMapsConnection *> "$out\maps.txt"
          $mapsExit = $LASTEXITCODE
          $st = Get-MpComputerStatus
          $pref = Get-MpPreference
          $sum.Add('| Runner property | Value |')
          $sum.Add('|---|---|')
          $sum.Add("| Antivirus enabled | $($st.AntivirusEnabled) (service $($st.AMServiceEnabled), real-time $($st.RealTimeProtectionEnabled), tamper protection $($st.IsTamperProtected)) |")
          $sum.Add("| Engine / signatures | $($st.AMEngineVersion) / $($st.AntivirusSignatureVersion) of $($st.AntivirusSignatureLastUpdated) |")
          $sum.Add("| Signature update | exit $sigExit |")
          $sum.Add("| Cloud protection | preference $cloudPref; MAPSReporting=$($pref.MAPSReporting), CloudBlockLevel=$($pref.CloudBlockLevel); connection test exit $mapsExit ($(if ($mapsExit -eq 0) { 'reachable, cloud verdicts possible' } else { 'not reachable: local signatures and ML only' })) |")
          $sum.Add('')
          Get-Content "$out\signature-update.txt", "$out\maps.txt"
          # The app executable inside the portable zip (the same file both installers carry).
          $inner = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive (Get-ChildItem installer-out\*-portable.zip)[0] -DestinationPath $inner
          $files = @(Get-ChildItem installer-out -File | Where-Object Name -ne 'SHA256SUMS-windows.txt') + @(Get-ChildItem $inner -Recurse -Filter rawtonic-app.exe)
          $sum.Add('| File | Verdict | MpCmdRun exit |')
          $sum.Add('|---|---|---|')
          $verdicts = ''
          foreach ($f in $files) {
            $name = if ($f.FullName.StartsWith($inner)) { 'rawtonic-app.exe (inside the downloads)' } else { $f.Name }
            # -DisableRemediation: report only, never quarantine (the artifact is evidence).
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation *> "$out\scan-$($f.Name).txt"
            $code = $LASTEXITCODE
            Get-Content "$out\scan-$($f.Name).txt"
            $threats = (Select-String -Path "$out\scan-$($f.Name).txt" -Pattern '^\s*Threat\s*:\s*(.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }) -join ', '
            # Exit 2 means a detection or a scan error: only named threats count as a detection.
            $verdict = if ($code -eq 0) { 'clean' } elseif ($code -eq 2 -and $threats) { "THREAT $threats" } else { 'scan error' }
            $sum.Add("| ``$name`` | $verdict | $code |")
            $verdicts += "defender: ${name}: $verdict (exit $code)`n"
          }
          $sum.Add('')
          $sum.Add("Recorded detections on this runner: $(@(Get-MpThreatDetection -ErrorAction SilentlyContinue).Count)")
          $sum -join "`n" >> $env:GITHUB_STEP_SUMMARY
          [IO.File]::WriteAllText("$out\summary.md", ($sum -join "`n"))
          [IO.File]::WriteAllText("$out\defender-verdicts.txt", $verdicts)
          $verdicts
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-defender
          path: ${{ runner.temp }}/defender/
          retention-days: 14
  # Each download on its own fresh runner: install (or unpack), try a headless
  # export, uninstall. Log lines carry the kind (nsis/msi/portable) for
  # scripts/release.sh.
  smoke:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi, portable]
    env:
      KIND: ${{ matrix.kind }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer-out
      - name: Verify the checksums
        run: |
          Set-Location installer-out
          foreach ($line in Get-Content SHA256SUMS-windows.txt) {
            $sum, $name = $line -split '  ', 2
            if ((Get-FileHash $name -Algorithm SHA256).Hash -ne $sum) { Write-Error "${name}: checksum mismatch"; exit 1 }
            "ok $name"
          }
      # Silent install. Both installers run `rawtonic-app --warm-gpu-cache`
      # afterwards (NSIS: src-tauri/windows/installer-hooks.nsh, MSI:
      # msi-warmup.wxs); the runner has no GPU, only Windows' software DX12
      # adapter (WARP). NSIS installs per user into a scratch folder, the MSI
      # per machine into Program Files (administrator; the runner is one).
      # The portable zip is unpacked into a folder with a space in its path.
      - name: Install silently (${{ matrix.kind }})
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          switch ($env:KIND) {
            'nsis' {
              $dir = Join-Path $env:RUNNER_TEMP 'Rawtonic install'
              $setup = (Get-ChildItem installer-out\*-setup.exe)[0].FullName
              # NSIS wants /D last and unquoted, spaces included.
              $p = Start-Process $setup -ArgumentList '/S', "/D=$dir" -PassThru -Wait
            }
            'msi' {
              $dir = Join-Path $env:ProgramFiles 'Rawtonic'
              $msi = (Get-ChildItem installer-out\*.msi)[0].FullName
              # Over a per-user NSIS installation the MSI must refuse (it would
              # share that folder); after the NSIS copy is uninstalled it installs.
              $setup = (Get-ChildItem installer-out\*-setup.exe)[0].FullName
              $q = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
              if ($q.ExitCode -ne 0) { Write-Error "NSIS install for the migration test failed ($($q.ExitCode))"; exit 1 }
              $nsisDir = Join-Path $env:LOCALAPPDATA 'Rawtonic'
              if (-not (Test-Path "$nsisDir\rawtonic-app.exe")) { Write-Error "NSIS copy not in $nsisDir"; exit 1 }
              $q = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\msi-over-nsis.log`"" -PassThru -Wait
              if ($q.ExitCode -eq 0 -or (Test-Path "$dir\rawtonic-app.exe")) { Write-Error "the MSI installed over the NSIS copy (exit $($q.ExitCode))"; exit 1 }
              if (-not (Select-String -Path "$env:RUNNER_TEMP\msi-over-nsis.log" -SimpleMatch 'already installed for your user' -Quiet)) { Write-Error 'the MSI refused without its message'; exit 1 }
              if (-not (Test-Path "$nsisDir\rawtonic-app.exe")) { Write-Error 'the refused MSI touched the NSIS copy'; exit 1 }
              "msi refused over the NSIS copy (exit $($q.ExitCode))"
              $q = Start-Process "$nsisDir\uninstall.exe" -ArgumentList '/S' -PassThru -Wait
              for ($i = 0; $i -lt 60 -and (Test-Path "$nsisDir\rawtonic-app.exe"); $i++) { Start-Sleep 1 }
              if (Test-Path "$nsisDir\rawtonic-app.exe") { Write-Error 'the NSIS copy was not uninstalled'; exit 1 }
              # The MSI's own warm-up must leave its log.
              Get-ChildItem $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter gpu-warmup.log -ErrorAction SilentlyContinue | Remove-Item
              # NSIS leaves HKCU\Software\<publisher>\Rawtonic behind; the MSI must still go to Program Files.
              $watch.Restart()
              $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\msi-install.log`"" -PassThru -Wait
            }
            'portable' {
              $base = Join-Path $env:RUNNER_TEMP 'Portable apps'
              Expand-Archive (Get-ChildItem installer-out\*-portable.zip)[0].FullName -DestinationPath $base
              $dir = Join-Path $base 'Rawtonic'
              $p = [pscustomobject]@{ ExitCode = 0 }
            }
          }
          "$env:KIND installer exit $($p.ExitCode) after $([math]::Round($watch.Elapsed.TotalSeconds, 1)) s"
          if ($p.ExitCode -ne 0) { if (Test-Path "$env:RUNNER_TEMP\msi-install.log") { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 60 }; exit 1 }
          if (-not (Test-Path "$dir\rawtonic-app.exe")) { Write-Error 'rawtonic-app.exe not installed'; exit 1 }
          foreach ($dll in 'onnxruntime.dll', 'onnxruntime_providers_webgpu.dll') {
            if (-not (Test-Path "$dir\resources\$dll")) { Write-Error "$dll not installed"; exit 1 }
          }
          $dxc = Get-ChildItem $dir -Recurse -Include dxcompiler.dll, dxil.dll
          if ($dxc) { Write-Error "DXC must not be bundled: $dxc"; exit 1 }
          if ($env:KIND -ne 'portable') {
            $log = Get-ChildItem $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter gpu-warmup.log -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $log) { Write-Error 'the GPU warm-up left no log: the hook did not run'; exit 1 }
            Get-Content $log.FullName
          }
          "INSTALL_DIR=$dir" >> $env:GITHUB_ENV
      # The publisher the signing policy names, in the executable's version
      # resource and wherever the installer records it.
      - name: Check the publisher metadata
        run: |
          $v = (Get-Item "$env:INSTALL_DIR\rawtonic-app.exe").VersionInfo
          "ProductName=$($v.ProductName) CompanyName=$($v.CompanyName) LegalCopyright=$($v.LegalCopyright) ProductVersion=$($v.ProductVersion)"
          if ($v.ProductName -ne 'Rawtonic' -or $v.CompanyName -ne 'Rawtonic Project' -or $v.LegalCopyright -notmatch 'Rawtonic contributors' -or -not $v.ProductVersion) {
            Write-Error 'the version resource of rawtonic-app.exe is wrong'; exit 1
          }
          switch ($env:KIND) {
            'nsis' {
              $k = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Rawtonic'
              "Apps & Features: $($k.DisplayName) / $($k.Publisher)"
              if ($k.Publisher -ne 'Rawtonic Project') { Write-Error 'wrong NSIS publisher'; exit 1 }
              $loc = (Get-ItemProperty 'HKCU:\Software\Rawtonic Project\Rawtonic').'(default)'
              if ($loc -ne $env:INSTALL_DIR) { Write-Error "install folder key is '$loc'"; exit 1 }
            }
            'msi' {
              $msi = (Get-ChildItem installer-out\*.msi)[0].FullName
              $wi = New-Object -ComObject WindowsInstaller.Installer
              $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($msi, 0))
              $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='Manufacturer'"))
              $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
              $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
              $manufacturer = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
              "MSI Manufacturer: $manufacturer"
              if ($manufacturer -ne 'Rawtonic Project') { Write-Error 'wrong MSI manufacturer'; exit 1 }
            }
          }
      # A synthetic gradient, no photograph: the installed app decodes,
      # develops on the GPU and encodes it without a window. The runner's only
      # adapter is WARP, Windows' software DX12, whose shader compiler corrupts
      # the heap on the processing pipeline (G57, task WW), so the app must
      # refuse it with a clear message and exit 1; on a runner with a real GPU
      # the export must succeed.
      - name: Headless export (software GPU refused cleanly)
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'windows-export-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          Start-Transcript -Path "$logs\export.log"
          Add-Type -AssemblyName System.Drawing
          $work = Join-Path $env:RUNNER_TEMP 'export'
          New-Item -ItemType Directory $work | Out-Null
          $png = "$work\gradient.png"
          $bmp = New-Object Drawing.Bitmap 1200, 800
          $g = [Drawing.Graphics]::FromImage($bmp)
          $rect = New-Object Drawing.Rectangle 0, 0, 1200, 800
          $brush = New-Object Drawing.Drawing2D.LinearGradientBrush $rect, ([Drawing.Color]::FromArgb(20, 40, 90)), ([Drawing.Color]::FromArgb(250, 200, 120)), 30.0
          $g.FillRectangle($brush, $rect)
          $g.FillEllipse([Drawing.Brushes]::ForestGreen, 400, 250, 400, 300)
          $g.Dispose()
          $bmp.Save($png, [Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          $before = (Get-FileHash $png).Hash
          $out = "$work\gradient.jpg"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process "$env:INSTALL_DIR\rawtonic-app.exe" -ArgumentList 'export', "`"$png`"", '--output', "`"$out`"", '--format', 'jpeg' -RedirectStandardOutput "$logs\stdout.log" -RedirectStandardError "$logs\stderr.log" -PassThru
          # Without a handle taken before the exit, ExitCode reads as null.
          $null = $p.Handle
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Error 'export hung (15 min)'; exit 1 }
          "$env:KIND export exit $($p.ExitCode) after $([math]::Round($watch.Elapsed.TotalSeconds, 1)) s"
          $log = Get-ChildItem $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter app.log -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($log) { Get-Content $log.FullName -Tail 40 }
          # The app found its ONNX Runtime beside itself (installed or unpacked anywhere).
          $ort = Select-String -Path "$logs\stdout.log" -Pattern 'Set ORT_DYLIB_PATH to: (.+)$' | Select-Object -First 1
          if (-not $ort) { Write-Error 'the app printed no ONNX Runtime path'; exit 1 }
          $ortPath = $ort.Matches[0].Groups[1].Value.Trim()
          # Rust's canonical paths carry the verbatim prefix \\?\.
          if ($ortPath.StartsWith('\\?\')) { $ortPath = $ortPath.Substring(4) }
          if (-not $ortPath.StartsWith($env:INSTALL_DIR) -or -not (Test-Path $ortPath)) { Write-Error "ONNX Runtime path $ortPath is not in $env:INSTALL_DIR"; exit 1 }
          "$env:KIND resources found: $ortPath"
          if ($p.ExitCode -ne 0) {
            $err = Get-Content "$logs\stderr.log" -Raw
            if ($p.ExitCode -eq 1 -and $err -match 'software renderer \(WARP\) is not supported') {
              if (Test-Path $out) { Write-Error 'a refused export left a file'; exit 1 }
              "$env:KIND WARP refused cleanly (exit 1)"
              exit 0
            }
            Write-Error "export failed (exit $($p.ExitCode)); see windows-export-logs artifact"
            exit 1
          }
          if (-not (Test-Path $out)) { Write-Error 'export produced no file'; exit 1 }
          $bytes = [IO.File]::ReadAllBytes($out)
          # A JPEG starts with FF D8.
          if ($bytes.Length -lt 10000 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xD8) { Write-Error "not a JPEG ($($bytes.Length) bytes)"; exit 1 }
          if ((Get-FileHash $png).Hash -ne $before) { Write-Error 'the input changed'; exit 1 }
          "ok gradient.png -> $($bytes.Length) bytes"
      - name: Collect the export diagnostics
        if: ${{ always() }}
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'windows-export-logs'
          New-Item -ItemType Directory -Force $logs | Out-Null
          $appLogs = Get-ChildItem $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter app.log -ErrorAction SilentlyContinue
          $i = 0
          foreach ($log in $appLogs) {
            Copy-Item $log.FullName "$logs\app-$i.log"
            $i++
          }
      - name: Upload the export diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-logs-${{ matrix.kind }}
          path: ${{ runner.temp }}/windows-export-logs/
          retention-days: 14
          if-no-files-found: warn
      - name: Uninstall silently
        if: ${{ !cancelled() && env.INSTALL_DIR != '' && matrix.kind != 'portable' }}
        run: |
          if ($env:KIND -eq 'nsis') {
            $p = Start-Process "$env:INSTALL_DIR\uninstall.exe" -ArgumentList '/S' -PassThru -Wait
          } else {
            $msi = (Get-ChildItem installer-out\*.msi)[0].FullName
            $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -PassThru -Wait
          }
          "$env:KIND uninstaller exit $($p.ExitCode)"
          # The NSIS uninstaller copies itself to %TEMP% and returns at once.
          for ($i = 0; $i -lt 60 -and (Test-Path "$env:INSTALL_DIR\rawtonic-app.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:INSTALL_DIR\rawtonic-app.exe") { Write-Error 'rawtonic-app.exe still installed'; exit 1 }
          "$env:KIND uninstalled"

  # An installation from the last release, updated by this build the way a user
  # does it (passive mode runs the replace-and-uninstall path of the reinstall
  # page): one entry in Apps & Features, the new publisher, the app starts,
  # a clean uninstall.
  upgrade:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer-out
      - name: Download the last release's installer
        run: |
          $tag = gh release list -R $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName'
          "last release: $tag"
          gh release download $tag -R $env:GITHUB_REPOSITORY -p '*_x64-setup.exe' -D old
          if (-not (Get-ChildItem old\*-setup.exe)) { Write-Error 'the last release has no NSIS installer'; exit 1 }
      - name: Install the old version, then update over it
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Rawtonic'
          $old = (Get-ChildItem old\*-setup.exe)[0].FullName
          $p = Start-Process $old -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "old install failed ($($p.ExitCode))"; exit 1 }
          $oldVersion = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Rawtonic').DisplayVersion
          "installed $oldVersion; HKCU\Software keys: $((Get-ChildItem HKCU:\Software | Where-Object { $_.PSChildName -match 'rawtonic' }).PSChildName -join ', ')"
          Get-ChildItem HKCU:\Software | Where-Object { $_.PSChildName -match 'rawtonic' } | ForEach-Object { Get-ChildItem $_.PSPath -Recurse | ForEach-Object { "$($_.Name) = $((Get-ItemProperty $_.PSPath).'(default)')" } }
          $new = (Get-ChildItem installer-out\*-setup.exe)[0].FullName
          $p = Start-Process $new -ArgumentList '/P' -PassThru -Wait
          "update exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$dir\rawtonic-app.exe"); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'Rawtonic' })
          "Apps & Features entries named Rawtonic: $($entries.Count)"
          if ($entries.Count -ne 1) { Write-Error 'expected exactly one Rawtonic entry'; exit 1 }
          $k = Get-ItemProperty $entries[0].PSPath
          "now $($k.DisplayVersion), publisher $($k.Publisher)"
          if ($k.DisplayVersion -eq $oldVersion -or $k.Publisher -ne 'Rawtonic Project') { Write-Error 'the update did not replace the old entry'; exit 1 }
          $v = (Get-Item "$dir\rawtonic-app.exe").VersionInfo
          "exe: $($v.ProductName) / $($v.CompanyName) / $($v.ProductVersion)"
          if ($v.CompanyName -ne 'Rawtonic Project') { Write-Error 'old executable still installed'; exit 1 }
          $loc = (Get-ItemProperty 'HKCU:\Software\Rawtonic Project\Rawtonic').'(default)'
          "install folder key: $loc"
          if ($loc -ne $dir) { Write-Error 'install folder key missing or wrong'; exit 1 }
          if (Test-Path 'HKCU:\Software\rawtonic\Rawtonic') { Write-Error 'legacy install folder key left behind'; exit 1 }
          # The updated app starts (it refuses WARP cleanly: exit 1 with its message, or exports).
          Add-Type -AssemblyName System.Drawing
          $png = Join-Path $env:RUNNER_TEMP 'g.png'
          $bmp = New-Object Drawing.Bitmap 400, 300
          $bmp.Save($png, [Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          $p = Start-Process "$dir\rawtonic-app.exe" -ArgumentList 'export', "`"$png`"", '--output', "`"$env:RUNNER_TEMP\g.jpg`"", '--format', 'jpeg' -RedirectStandardError "$env:RUNNER_TEMP\err.log" -RedirectStandardOutput "$env:RUNNER_TEMP\out.log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error 'app hung'; exit 1 }
          "app exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and -not ((Get-Content "$env:RUNNER_TEMP\err.log" -Raw) -match 'software renderer \(WARP\) is not supported')) { Get-Content "$env:RUNNER_TEMP\err.log"; Write-Error 'the updated app does not run'; exit 1 }
          "INSTALL_DIR=$dir" >> $env:GITHUB_ENV
      - name: Uninstall
        run: |
          $p = Start-Process "$env:INSTALL_DIR\uninstall.exe" -ArgumentList '/S' -PassThru -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$env:INSTALL_DIR\rawtonic-app.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:INSTALL_DIR\rawtonic-app.exe") { Write-Error 'still installed'; exit 1 }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Rawtonic') { Write-Error 'Apps & Features entry left behind'; exit 1 }
          'update from the last release: ok, uninstalled clean'

  # The first page of each installer as the user sees it, captured from the
  # runner's desktop (an interactive install, killed after the screenshot).
  installer-pages:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer-out
      - name: Capture the privacy notice pages
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = Join-Path $env:RUNNER_TEMP 'pages'
          New-Item -ItemType Directory $shots | Out-Null
          function Shot($name) {
            $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$shots\$name.png", [Drawing.Imaging.ImageFormat]::Png)
          }
          $setup = (Get-ChildItem installer-out\*-setup.exe)[0].FullName
          $p = Start-Process $setup -PassThru
          Start-Sleep 12
          Shot 'nsis-first-page'
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.Name -match 'Rawtonic.*setup|^Au_' } | Stop-Process -Force -ErrorAction SilentlyContinue
          $msi = (Get-ChildItem installer-out\*.msi)[0].FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"" -PassThru
          Start-Sleep 12
          Shot 'msi-first-dialog'
          Get-Process msiexec -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-ChildItem $shots
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-installer-pages
          path: ${{ runner.temp }}/pages/
          retention-days: 14
          if-no-files-found: warn
