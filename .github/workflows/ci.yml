# Quality gates on Linux after every merge into main (and on demand). Before
# a merge the same checks run locally: scripts/check.sh. macOS is checked
# there; GitHub's macOS minutes count tenfold on a private repository.
name: Quality gates
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The workspace test binaries (wgpu, ONNX Runtime, Tauri) with debug info
  # filled the runner's disk while linking; CI needs no debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # The runner image's preinstalled SDKs we do not use, ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cargo-deny as a binary on the pinned toolchain: the Docker action
      # installs the toolchain again and ran out of disk after the build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses bans sources
      # Vulnerabilities and unsound crates fail; unmaintained ones warn here and
      # fail in advisories.yml and the release workflows (ADR 0005).
      - run: cargo deny check -W unmaintained advisories
      - name: Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev patchelf libxdo-dev cmake nasm
      - run: npm ci
      - run: python3 scripts/third_party_licenses.py --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/check_layering.sh
      - run: cargo test --workspace --locked
      - if: always()
        run: df -h /
