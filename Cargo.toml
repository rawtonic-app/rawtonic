[workspace]
resolver = "3"
members = ["crates/workspace-hack","src-tauri", "crates/*", "third_party/rawler"]
exclude = ["vendor/little_exif", "vendor/paste", "vendor/glib-macros", "vendor/gtk3-macros"]
default-members = [
    "crates/catalog",
    "crates/naming",
    "crates/metadata",
    "crates/ingest",
    "crates/fileops",
    "crates/interop",
    "crates/runtime",
    "crates/rawdecode",
    "crates/engine",
    "crates/gpu",
    "crates/export",
    "crates/merge",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
sha2 = "0.11"

[profile.dev]
opt-level = 1
debug = 1

# The AV1 decoder for AVIF sources (crates/engine/src/avif.rs) took 16-19 s
# for a 45 MP file at the dev profile's settings, 0.35 s like this.
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[patch.crates-io]
little_exif = { path = "vendor/little_exif" }
# No unmaintained macro crates (ADR 0005): `paste` (used by pulp, via
# image -> exr) is served by its maintained successor pastey; glib-macros and
# gtk3-macros 0.18 (Linux, via Tauri's gtk 0.18) without proc-macro-error.
paste = { path = "vendor/paste" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
# zvariant, zvariant_derive and zbus_names (unmaintained, merged into zbus 6):
# tauri-plugin-single-instance with its Linux D-Bus code on zbus 6.
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }

[patch."https://github.com/CyberTimon/RapidRAW-DngLab.git"]
rawler = { path = "third_party/rawler" }
