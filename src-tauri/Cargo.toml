[package]
name = "rawtonic-app"
version = "0.1.0-alpha.6"
license = "AGPL-3.0-or-later"
default-run = "rawtonic-app"
description = "Non-destructive photo editor with native GPU rendering and portable sessions (development build)."
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "rapidraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Profiling builds also count live wgpu resources for memory diagnosis.
performance-profiling = [
    "wgpu/counters",
    "rawtonic-export/performance-profiling",
    "rawtonic-gpu/performance-profiling",
    "rawtonic-engine/performance-profiling",
    "rawtonic-rawdecode/performance-profiling",
    "rawtonic-runtime/performance-profiling",
]
# Loopback QA control channel (src/qa_control.rs); never in release bundles.
qa-control = []

[dependencies]
rawtonic-catalog = { path = "../crates/catalog", version = "0.1.0" }
rawtonic-contribute = { path = "../crates/contribute", version = "0.1.0" }
rawtonic-metadata = { path = "../crates/metadata", version = "0.1.0" }
rawtonic-ingest = { path = "../crates/ingest", version = "0.1.0" }
rawtonic-tether = { path = "../crates/tether", version = "0.1.0" }
rawtonic-naming = { path = "../crates/naming", version = "0.1.0" }
rawtonic-engine = { path = "../crates/engine", version = "0.1.0" }
rawtonic-merge = { path = "../crates/merge", version = "0.1.0" }
rawtonic-export = { path = "../crates/export", version = "0.1.0" }
rawtonic-gpu = { path = "../crates/gpu", version = "0.1.0" }
rawtonic-rawdecode = { path = "../crates/rawdecode", version = "0.1.0" }
rawtonic-denoise = { path = "../crates/denoise", version = "0.1.0" }
rawtonic-faces = { path = "../crates/faces", version = "0.1.0" }
rawtonic-onnx = { path = "../crates/onnx", version = "0.1.0" }
rawtonic-runtime = { path = "../crates/runtime", version = "0.1.0" }
rawtonic-fileops = { path = "../crates/fileops", version = "0.1.0" }
rawtonic-interop = { path = "../crates/interop", version = "0.1.0" }
tauri = { version = "2.11", features = [ "macos-private-api", "rustls-tls", "protocol-asset" ] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
image = "0.25.10"
# libjpeg-turbo, built from the bundled source (no system library, SIMD when
# nasm is present): JPEG exports 2.3x faster than image's encoder.
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }
base64 = "0.23"
tauri-plugin-fs = "2.5.1"
rayon = "1.12.0"
blake3 = "1.8.7"
wgpu = "29.0" # Downgraded to prevent P3 color shifts on Apple devices
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0.104"
kamadak-exif = "0.6.1"
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git", version = "0.7.1" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.25", features = ["v4", "serde"] }
walkdir = "2.5.0"
# No `text` feature: its font parser (ttf-parser) is unmaintained and unused;
# `image` keeps its default features through the direct dependency above.
imageproc = { version = "0.27.0", default-features = false, features = ["rayon", "fft"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
ndarray = "0.17"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
log = "0.4"
fern = "0.7"
little_exif = "0.6.23"
chrono = "0.4"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
once_cell = "1.21"
futures = "0.3.34"
sha2 = "0.11"
hex = "0.4"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"
mimalloc = "0.1.52"
image_hasher = "3.1.1"
regex = "1.13.1"
memmap2 = "0.9.11"
half = { version = "2.7.1", features = ["bytemuck"] }
flate2 = "1.1.9"
roxmltree = "0.21"
mozjpeg-rs = "0.9.2"
jxl-oxide = { version = "0.12.6", features = ["image"] }
libc = "0.2.189"
rgb = "0.8.53"
imgref = "1.12.2"
sysinfo = "0.39.6"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }

# The system Trash through `trash` on Windows and Linux; macOS uses
# NSFileManager directly (file_operations.rs).
[target.'cfg(any(windows, all(unix, not(target_os = "macos"))))'.dependencies]
trash = "5.2.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSError",
    "NSFileManager",
    "NSDictionary",
    "NSString",
    "NSURL",
    "NSValue",
    "NSArray",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace"] }
objc2-core-image = { version = "0.3.2", features = [
    "CIContext",
    "CIFilter",
    "CIImage",
    "CIRAWFilter",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"
tauri-plugin-wayland-nvidia-quirk = "0.1.0"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
# Fail the build if NASM is missing instead of shipping slow JPEG previews.
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }

[dev-dependencies]
rawtonic-catalog = { path = "../crates/catalog", version = "0.1.0", features = ["test-support"] }
rawtonic-engine = { path = "../crates/engine", version = "0.1.0", features = ["test-support"] }
rawtonic-rawdecode = { path = "../crates/rawdecode", version = "0.1.0", features = ["test-support"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[[test]]
name = "fixture_render"
path = "tests/fixture_render.rs"
harness = false
