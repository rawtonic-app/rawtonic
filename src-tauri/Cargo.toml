[package]
name = "rawtonic-app"
version = "0.1.0-alpha.11.1"
license = "AGPL-3.0-or-later"
default-run = "rawtonic-app"
description = "Non-destructive photo editor with native GPU rendering and portable sessions (development build)."
authors = ["Rawtonic contributors", "Timon Käch (RapidRAW)"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "rapidraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Profiling builds also count live wgpu resources for memory diagnosis.
performance-profiling = [
    "wgpu/counters",
    "rawtonic-export/performance-profiling",
    "rawtonic-gpu/performance-profiling",
    "rawtonic-engine/performance-profiling",
    "rawtonic-rawdecode/performance-profiling",
    "rawtonic-runtime/performance-profiling",
]
# Loopback QA control channel (src/qa_control.rs); never in release bundles.
qa-control = []

[lints]
workspace = true

[dependencies]
rawtonic-catalog = { path = "../crates/catalog", version = "0.1.0" }
rawtonic-contribute = { path = "../crates/contribute", version = "0.1.0" }
rawtonic-fs = { path = "../crates/fs", version = "0.1.0" }
rawtonic-metadata = { path = "../crates/metadata", version = "0.1.0" }
rawtonic-ingest = { path = "../crates/ingest", version = "0.1.0" }
rawtonic-tether = { path = "../crates/tether", version = "0.1.0" }
rawtonic-naming = { path = "../crates/naming", version = "0.1.0" }
rawtonic-engine = { path = "../crates/engine", version = "0.1.0" }
rawtonic-merge = { path = "../crates/merge", version = "0.1.0" }
rawtonic-export = { path = "../crates/export", version = "0.1.0" }
rawtonic-gpu = { path = "../crates/gpu", version = "0.1.0" }
rawtonic-rawdecode = { path = "../crates/rawdecode", version = "0.1.0" }
rawtonic-denoise = { path = "../crates/denoise", version = "0.1.0" }
rawtonic-faces = { path = "../crates/faces", version = "0.1.0" }
rawtonic-segment = { path = "../crates/segment", version = "0.1.0" }
rawtonic-onnx = { path = "../crates/onnx", version = "0.1.0" }
rawtonic-runtime = { path = "../crates/runtime", version = "0.1.0" }
rawtonic-fileops = { path = "../crates/fileops", version = "0.1.0" }
rawtonic-interop = { path = "../crates/interop", version = "0.1.0" }
tauri = { version = "2.12", features = [ "macos-private-api", "rustls-tls", "protocol-asset" ] }
tauri-plugin-dialog = "2.8.4"
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1.0"
image = { workspace = true }
# libjpeg-turbo, built from the bundled source (no system library, SIMD when
# nasm is present): JPEG exports 2.3x faster than image's encoder.
turbojpeg = { workspace = true, features = ["cmake"] }
base64 = { workspace = true }
tauri-plugin-fs = "2.7.1"
rayon = { workspace = true }
blake3 = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
kamadak-exif = { workspace = true }
rawler = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir = { workspace = true }
# No `text` feature: its font parser (ttf-parser) is unmaintained and unused;
# `image` keeps its default features through the direct dependency above.
imageproc = { workspace = true, features = ["rayon", "fft"] }
ort = { workspace = true, features = ["std", "ndarray", "load-dynamic", "api-22"] }
ndarray = { workspace = true }
tauri-plugin-process = "2.4.0"
tauri-plugin-os = "2.4.0"
log = { workspace = true }
fern = "0.7"
little_exif = { workspace = true }
chrono = { workspace = true }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
once_cell = "1.21"
futures = "0.3.34"
sha2 = { workspace = true }
tauri-plugin-shell = "2.6.0"
tempfile = { workspace = true }
mimalloc = { workspace = true }
image_hasher = "3.1.1"
regex = { workspace = true }
memmap2 = { workspace = true }
half = { workspace = true, features = ["bytemuck"] }
flate2 = { workspace = true }
roxmltree = { workspace = true }
mozjpeg-rs = "0.9.2"
jxl-oxide = { workspace = true, features = ["image"] }
libc = { workspace = true }
rgb = "0.8.53"
imgref = "1.12.2"
sysinfo = "0.39.6"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
reqwest = { workspace = true, features = ["json", "rustls"] }

# The system Trash through `trash` on Windows and Linux; macOS uses
# NSFileManager directly (file_operations.rs).
[target.'cfg(any(windows, all(unix, not(target_os = "macos"))))'.dependencies]
trash = "5.2.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.56.0", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSBundle", "NSData", "NSError", "NSFileManager", "NSDictionary", "NSString", "NSURL", "NSValue", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace"] }
objc2-core-image = { version = "0.3.2", features = [
    "CIContext",
    "CIFilter",
    "CIImage",
    "CIRAWFilter",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"
tauri-plugin-wayland-nvidia-quirk = "0.1.0"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
# Fail the build if NASM is missing instead of shipping slow JPEG previews.
turbojpeg = { workspace = true, features = ["cmake", "require-simd"] }

[dev-dependencies]
rawtonic-catalog = { path = "../crates/catalog", version = "0.1.0", features = ["test-support"] }
rawtonic-engine = { path = "../crates/engine", version = "0.1.0", features = ["test-support"] }
rawtonic-rawdecode = { path = "../crates/rawdecode", version = "0.1.0", features = ["test-support"] }
pollster = { workspace = true }
# Test code only: the Capture One import tests build real session files and
# read them back through `rawtonic-interop`.
rusqlite = { workspace = true, features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
hex = "0.4"


[[test]]
name = "fixture_render"
path = "tests/fixture_render.rs"
harness = false
